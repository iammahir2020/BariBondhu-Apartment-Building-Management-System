# SonarQube Cloud settings for the BariBondhu app in code/. The GitHub Actions workflow
# (.github/workflows/build.yml) runs the tests first, so coverage comes from code/coverage/lcov.info.

sonar.projectKey=iammahir2020_BariBondhu-Apartment-Building-Management-System
sonar.organization=iammahir2020
sonar.projectName=BariBondhu
sonar.sourceEncoding=UTF-8

# Source and test files live side by side in code/src; tests end in .test.ts or .test.tsx.
sonar.sources=code/src
sonar.tests=code/src
sonar.test.inclusions=code/src/**/*.test.ts,code/src/**/*.test.tsx
# Not ours to review: the shadcn components (generated), and the test files and test helpers, which are not source.
sonar.exclusions=code/src/components/ui/**,code/src/**/*.test.ts,code/src/**/*.test.tsx,code/src/**/test*.ts

sonar.typescript.tsconfigPaths=code/tsconfig.json
sonar.javascript.lcov.reportPaths=code/coverage/lcov.info

# Left out of the coverage count, but still checked for bugs and code smells: connection code (database, Supabase,
# email, cookies), the database schema, and pages, layouts, API routes and the middleware, which only wire the
# tested services to the web. Business rules (src/services, src/lib/permissions.ts ...) stay in the 80% gate.
# Keep this list the same as the "!" entries in collectCoverageFrom in code/jest.config.mjs.
# SonarQube Cloud now analyses the whole repository and ignores sonar.sources, so the demo seed scripts in
# code/scripts are counted too. Jest never collects them (collectCoverageFrom only lists src), and they only write
# demo rows to the database, so they are left out here as well.
sonar.coverage.exclusions=\
  code/scripts/**,\
  code/src/app/**,\
  code/src/middleware.ts,\
  code/src/models/**,\
  code/src/lib/db.ts,\
  code/src/lib/env.ts,\
  code/src/lib/gatewaySecret.ts,\
  code/src/lib/auth.ts,\
  code/src/lib/session.ts,\
  code/src/lib/mailer.ts,\
  code/src/lib/utils.ts,\
  code/src/lib/supabase/**,\
  code/src/lib/adapters/**,\
  code/src/services/auditService.ts,\
  code/src/components/AppShell.tsx,\
  code/src/components/RoleNav.tsx,\
  code/src/components/auth/AuthFrame.tsx
