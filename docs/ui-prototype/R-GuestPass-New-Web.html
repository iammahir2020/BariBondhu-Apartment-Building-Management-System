<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":860}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { count: 4 }; }
  renderVals() {
    const c = this.state.count;
    return {
      count: c,
      inc: () => this.setState({ count: Math.min(20, c + 1) }),
      dec: () => this.setState({ count: Math.max(1, c - 1) })
    };
  }
}
</script>
