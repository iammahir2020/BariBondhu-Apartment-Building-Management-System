<script type="text/x-dc" data-dc-script data-props='{"show":{"editor":"enum","options":["Households","Staff and committee"],"default":"Households"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const v = this.state.view ?? ((this.props.show ?? 'Households') === 'Households' ? 'hh' : 'staff');
    return {
      households: v === 'hh', staff: v === 'staff',
      hhCls: v === 'hh' ? 'on' : '', staffCls: v === 'staff' ? 'on' : '',
      pickHouseholds: () => this.setState({ view: 'hh' }),
      pickStaff: () => this.setState({ view: 'staff' })
    };
  }
}
</script>
