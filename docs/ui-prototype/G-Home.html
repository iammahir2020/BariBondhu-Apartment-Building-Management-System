<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>পাস যাচাই · BariBondhu prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@600&amp;display=swap">
<style>body{margin:0}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.key{height:60px;border-radius:14px;border:1px solid var(--line);background:#fff;font-family:Inter,sans-serif;font-size:26px;font-weight:600;color:var(--ink)}
.key.fn{background:var(--bg);font-size:15px;font-family:'Hind Siliguri',Inter,sans-serif}
.codebox{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.cell{height:60px;border-radius:12px;background:#fff;border:2px solid var(--field);display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:600}
.cell.next{border-color:var(--brand-700)}
</style>
<link rel="stylesheet" href="bb.css">
<link rel="stylesheet" href="proto.css">
</head>
<body class="proto-phone">
<div class="proto-bar"><a href="index.html">← All screens</a><span class="proto-title">Guard · Check a pass</span><span id="proto-controls" class="row wrap" style="gap: 12px"></span></div>
<div class="proto-stage">
<template id="screen">
<div class="phone bn" style="height: 800px">
  <header class="topbar">
    <div class="stack" style="gap: 0"><div class="h3">গেট · সেলিম</div><div class="en-hint">Gate · Selim, on duty until 10 pm</div></div>
    <span class="spacer"></span>
    <a class="lang" href="S-Login.html" aria-label="Switch guard">বদল</a>
    <a class="sos" href="S-Emergency.html"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg>জরুরি</a>
  </header>
  <main class="content" style="gap: 12px">
    <sc-if value="{{ offline }}" hint-placeholder-val="{{ false }}">
      <div class="alert alert-urgent" role="alert"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12a7 7 0 0 1 14 0M8.5 12a3.5 3.5 0 0 1 7 0"/><path d="M12 16v.5M3 3l18 18"/></svg><div><div class="h3">সংযোগ নেই: ইন্টারকম ও কাগজের খাতা ব্যবহার করুন</div><div class="en-hint" style="color: inherit">No connection: use the intercom and paper register</div></div></div>
    </sc-if>
    <div class="row between"><div><div class="h2">পাস কোড লিখুন</div><div class="en-hint">Type the guest's 6-digit code</div></div>
      <a class="btn btn-secondary sm" href="G-Pass-Valid.html" style="padding: 0 14px"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V3h4M17 3h4v4M21 17v4h-4M7 21H3v-4M7 12h10"/></svg>QR স্ক্যান</a>
    </div>
    <div class="codebox" aria-live="polite" aria-label="Code entered">
      <sc-for list="{{ cells }}" as="c" hint-placeholder-count="6"><span class="{{ c.cls }}">{{ c.d }}</span></sc-for>
    </div>
    <div class="keys" role="group" aria-label="Number keys">
      <sc-for list="{{ keys }}" as="k" hint-placeholder-count="9"><button type="button" class="key" onClick="{{ k.press }}">{{ k.d }}</button></sc-for>
      <button type="button" class="key fn" onClick="{{ clear }}">মুছুন</button>
      <button type="button" class="key" onClick="{{ zero }}">0</button>
      <button type="button" class="key fn" onClick="{{ back }}" aria-label="Delete last digit">⌫</button>
    </div>
    <sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}"><a class="btn btn-primary full" href="{{ checkHref }}">যাচাই করুন <span class="en-hint" style="color: var(--brand-100)">Check</span></a></sc-if>
    <sc-if value="{{ notReady }}" hint-placeholder-val="{{ true }}"><span class="btn full disabled">যাচাই করুন <span class="en-hint">Check</span></span></sc-if>
  </main>
  <nav class="navbar" aria-label="প্রধান" style="grid-template-columns: repeat(3, minmax(0, 1fr))">
    <a class="on" href="G-Home.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h3v3h-3zM18 18h3v3h-3z"/></svg>পাস যাচাই</a>
    <a href="G-Inside.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M16 4a4 4 0 0 1 0 8M22 21c0-3-1.5-5-4-5.6"/></svg>ভেতরে আছেন · ৭</a>
    <a href="G-Duty.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>ডিউটি</a>
  </nav>
</div>
</template>
<div id="mount"></div>
</div>
<script type="text/x-dc" data-dc-script data-props='{"offline":{"editor":"boolean","default":false},"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { code: '4829' }; }
  renderVals() {
    const code = this.state.code;
    const add = (d) => () => { if (code.length < 6) this.setState({ code: code + d }); };
    const cells = [0, 1, 2, 3, 4, 5].map((i) => ({ d: code[i] || '', cls: 'cell' + (i === code.length ? ' next' : '') }));
    return {
      offline: !!this.props.offline,
      cells,
      keys: ['1', '2', '3', '4', '5', '6', '7', '8', '9'].map((d) => ({ d, press: add(d) })),
      zero: add('0'),
      clear: () => this.setState({ code: '' }),
      back: () => this.setState({ code: code.slice(0, -1) }),
      ready: code.length === 6, notReady: code.length !== 6,
      checkHref: code === '111111' ? 'G-Pass-Invalid.html' : 'G-Pass-Valid.html'
    };
  }
}
</script>
<script src="proto.js"></script>
<script src="hotspots.js"></script>
</body>
</html>
