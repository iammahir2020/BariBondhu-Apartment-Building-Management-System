      <div class="row between" style="margin-bottom: 6px">
        <div><div class="h2">November 2026</div><div class="small">Bill BB-2611-05B · due 20 Nov 2026</div></div>
        <sc-if value="{{ unpaid }}" hint-placeholder-val="{{ true }}"><span class="badge b-warn">Unpaid</span></sc-if>
        <sc-if value="{{ rejected }}" hint-placeholder-val="{{ false }}"><span class="badge b-warn">Unpaid</span></sc-if>
        <sc-if value="{{ pending }}" hint-placeholder-val="{{ false }}"><span class="badge b-info">Payment pending</span></sc-if>
        <sc-if value="{{ awaiting }}" hint-placeholder-val="{{ false }}"><span class="badge b-info">Awaiting verification</span></sc-if>
      </div>
      <div class="line"><span>Service charge</span><span class="money" style="font-weight: 500">৳3,500.00</span></div>

      <div class="line"><span>Water</span><span class="money" style="font-weight: 500">৳550.00</span></div>
      <div class="line total"><span>Total</span><span class="money">৳4,850.00</span></div>
    </section>

    <sc-if value="{{ rejected }}" hint-placeholder-val="{{ false }}">
      <div class="alert alert-warn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16v.5"/></svg><div><div class="h3">Your cash payment was not accepted</div><div>Manager: "No cash received on 12 Nov. Please check with the office." Pay again below.</div></div></div>
    </sc-if>
    <sc-if value="{{ pending }}" hint-placeholder-val="{{ false }}">
      <div class="alert alert-info"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><div><div class="h3">Waiting for the payment gateway</div><div>We'll mark it Paid as soon as the gateway confirms, even if you close the app. If nothing arrives in 30 minutes, you can pay again.</div></div></div>
    </sc-if>
    <sc-if value="{{ awaiting }}" hint-placeholder-val="{{ false }}">
      <div class="alert alert-info"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><div><div class="h3">The manager is checking your cash payment</div><div>৳4,850.00 recorded on 15 Nov. You won't be listed as late while it is checked.</div></div></div>
    </sc-if>

    <sc-if value="{{ canPay }}" hint-placeholder-val="{{ true }}">
      <div class="stack" style="gap: 10px">
        <a class="btn btn-primary full" href="R-Receipt-Web.html">Pay ৳4,850.00 online</a>
        <a class="btn btn-secondary full" href="R-RecordPayment-Web.html">I paid in cash or by bank</a>
      </div>
    </sc-if>
    <sc-if value="{{ locked }}" hint-placeholder-val="{{ false }}">
      <div class="stack" style="gap: 10px">
        <span class="btn full disabled">Pay ৳4,850.00 online</span>
        <span class="btn full disabled">I paid in cash or by bank</span>
      </div>
    </sc-if>

    <div class="stack tight" style="margin-top: 4px">
      <div class="h3">Earlier bills</div>
      <section class="card flush">
        <a class="listitem" href="R-Receipt-Web.html"><div class="grow"><div class="h3">October 2026</div><div class="small">Paid online 8 Oct · receipt R-2610-0142</div></div><span class="money" style="font-weight: 600">৳4,850.00</span><span class="badge b-ok">Paid</span></a>
        <a class="listitem" href="R-Receipt-Web.html"><div class="grow"><div class="h3">September 2026</div><div class="small">Paid in cash 11 Sep · receipt R-2609-0098</div></div><span class="money" style="font-weight: 600">৳4,600.00</span><span class="badge b-ok">Paid</span></a>
      </section>
    </div>

<div id="mount"></div>
</div>
<script type="text/x-dc" data-dc-script data-props='{"billState":{"editor":"enum","options":["Unpaid","Payment pending","Awaiting verification","Claim rejected"],"default":"Unpaid"},"$preview":{"width":360,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.billState ?? 'Unpaid';
    const pending = s === 'Payment pending';
    const awaiting = s === 'Awaiting verification';
    return {
      unpaid: s === 'Unpaid', rejected: s === 'Claim rejected', pending, awaiting,
      canPay: !pending && !awaiting, locked: pending || awaiting
    };
  }
}
</script>
