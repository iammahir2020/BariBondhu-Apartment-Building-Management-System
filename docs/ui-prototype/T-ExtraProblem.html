<body class="proto-phone">
<div class="proto-bar"><a href="index.html">← All screens</a><span class="proto-title">Maintenance · Report an extra problem</span><span class="proto-view">View: <b aria-current="page">Phone</b> · <a href="T-ExtraProblem-Web.html">Web</a></span></div>
<div class="proto-stage">
<div class="phone" style="height: 820px">
  <header class="topbar sub">
    <a class="iconbtn" href="T-Detail.html" aria-label="Back"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <h1 class="title">Extra problem</h1>
    <span class="spacer"></span>
    <a class="sos round" href="S-Emergency.html" aria-label="Emergency numbers"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg></a>
  </header>
  <main class="content" style="gap: 16px">
    <div class="alert alert-info"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.5"/></svg><div>Found while working on <b>#T-1043 Kitchen tap leaking</b>. It becomes a new ticket marked Found by staff, and the manager assigns it.</div></div>
    <div class="field"><span class="flabel">What kind?</span>
      <div class="chips"><button type="button" class="chip on">Plumbing</button><button type="button" class="chip">Electrical</button><button type="button" class="chip">Lift</button><button type="button" class="chip">Other</button></div>
    </div>
    <div class="field"><label for="pl">Where</label><select id="pl" class="input"><option>Flat 5B</option><option>Water pump</option><option>Stairs</option><option>Roof</option><option>Other common area</option></select></div>
    <div class="field"><label for="ds">Describe the problem</label><textarea id="ds" class="input error"></textarea><span class="errtext">Describe the problem</span></div>
    <span class="spacer"></span>
    <a class="btn btn-primary full" href="T-Detail.html">Send to manager</a>
  </main>
</div>
</div>
<script src="hotspots.js"></script>
</body>
